; Base export preset for the grid. build.ps1 copies this into the per-cell
; staging directory and patches:
;   export_path                    -> out/<cell>/grid.exe
;   custom_template/release|debug  -> a double-precision template when one is
;                                     supplied (no OFFICIAL double-precision
;                                     export templates exist — see README).
; Options absent from this file fall back to the engine defaults, which is why
; it is short: fewer keys means fewer version-to-version incompatibilities.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
codesign/enable=false
application/modify_resources=false
application/icon_interpolation=4
application/console_wrapper_icon=""
ssh_remote_deploy/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
